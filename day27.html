<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2eb"><title>DAY27｜World History Speed Master</title><style>
:root{--bg:#f5f2eb;--paper:#fffefa;--ink:#20332f;--muted:#68756f;--line:#deddd3;--accent:#ac5033;--soft:#f8e8dd;--green:#e8f0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.85;-webkit-text-size-adjust:100%}.top{position:sticky;top:0;z-index:10;background:#f5f2ebef;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:780px;margin:auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.home{color:var(--ink);text-decoration:none;font-size:13px;font-weight:800}.counter{font-size:12px;color:var(--muted);font-weight:700}.wrap{max-width:780px;margin:auto;padding:22px 16px 120px}.progress{height:5px;background:#e8e7df;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress i{display:block;height:100%;background:var(--accent);transition:.2s}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:30px 32px;box-shadow:0 10px 38px #2033300b}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--accent);margin-bottom:9px}h1{font-size:clamp(27px,5vw,38px);line-height:1.35;letter-spacing:-.035em;margin:0 0 18px}p{margin:13px 0}.take{background:var(--green);border-radius:14px;padding:17px 19px;margin:20px 0;font-weight:750}.note{background:#fdf4ed;border:1px solid #edd1c3;border-radius:14px;padding:15px 18px;margin:20px 0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{background:var(--soft);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:750}.quiz{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.quiz button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-weight:750;color:var(--ink)}.answer{display:none;background:#f6f5ef;border-radius:10px;padding:12px 14px;margin-top:9px}.nav{position:fixed;left:0;right:0;bottom:0;background:#f5f2ebf2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.navin{max-width:780px;margin:auto;display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.nav button{border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-weight:850;background:var(--paper);color:var(--ink)}.nav .next{background:var(--accent);color:white;border-color:var(--accent)}.done{display:inline-block;margin-top:14px;color:var(--accent);font-weight:800;text-decoration:none}@media(max-width:560px){.card{padding:24px 20px}.wrap{padding-left:12px;padding-right:12px}.navin{grid-template-columns:1fr 1.6fr}}
</style></head><body><header class="top"><div class="topin"><a class="home" href="index.html">← DAY一覧</a><span class="counter" id="counter"></span></div></header><main class="wrap"><div class="progress"><i id="bar"></i></div><article class="card" id="card"></article></main><nav class="nav"><div class="navin"><button id="prev">← 前へ</button><button class="next" id="next">次へ進む →</button></div></nav><script>
const cards=[
{sec:'① 戦後世界秩序の形成',title:'国連は「大国抜きの平和」を目指さなかった。',take:'大国を外に置かず、特別な権限を与えて国際平和の仕組みに参加させる。',body:`第二次世界大戦を防げなかった国際連盟に代わり、戦後の平和を維持するために国際連合がつくられた。重要なのは、戦後になって突然できたのではなく、戦争中から構想が進んでいたこと。<div class="note">安全保障理事会の常任理事国は発足時の米・英・仏・ソ・中。大国の合意を重視したため、常任理事国には拒否権が認められた。</div>`,q:'なぜ常任理事国に拒否権を与えたの？',a:'大国を国際秩序の外に追い出さず、参加と協調を確保するため。ただし大国同士が対立すると決議が難しくなる。'},
{sec:'① 戦後世界秩序の形成',title:'政治の国連、経済のブレトン＝ウッズ。',take:'平和だけでなく、通貨・復興資金・貿易の仕組みもつくり直した。',body:`1930年代の経済対立を繰り返さないため、戦後は国際経済の安定を重視した。<div class="chips"><span class="chip">IMF：通貨・為替</span><span class="chip">IBRD：復興・開発融資</span><span class="chip">GATT：関税引下げ</span></div>ドルを中心とした国際通貨体制と、貿易自由化の枠組みが整えられていく。`,q:'GATTの役割を一言で言うと？',a:'関税などの貿易障壁を下げ、貿易を自由化していくこと。'},
{sec:'② 米ソ冷戦の始まりと西欧諸国',title:'1947年、「協力」から「封じ込め」へ。',take:'アメリカは援助で西側を支え、ソ連は東欧で影響力を強めた。',body:`戦争中は共通の敵がいた米ソも、戦後の政治・経済体制をめぐって対立する。アメリカはトルーマン＝ドクトリンやマーシャル＝プランで西側を支え、ソ連は東欧に社会主義体制を広げた。<div class="note">経済援助も冷戦政策。生活と経済を安定させ、共産主義への支持拡大を防ぐ狙いがあった。</div>`,q:'なぜ経済援助が「封じ込め」になるの？',a:'貧困や混乱を減らし、共産主義勢力が支持を広げにくくするため。'},
{sec:'② 米ソ冷戦の始まりと西欧諸国',title:'ベルリンの場所が分かると、封鎖が分かる。',take:'西ベルリンは西側地域と地続きではなく、ソ連占領地域の中にあった。',body:`ドイツもベルリンも4か国で分割占領されたが、ベルリンそのものはソ連占領地域の内部にあった。だから西側管理地区への陸路輸送を止めることができた。これがベルリン封鎖である。西側は空輸で対抗した。`,q:'ベルリン封鎖とベルリンの壁は同じ出来事？',a:'別。ベルリン封鎖は1948〜49年、ベルリンの壁は1961年。'},
{sec:'② 米ソ冷戦の始まりと西欧諸国',title:'「経済の組織」と「軍事の組織」を分ける。',take:'名前を暗記するより、何のための組織かで整理する。',body:`<div class="chips"><span class="chip">マーシャル＝プラン：経済復興</span><span class="chip">NATO：西側軍事同盟</span><span class="chip">コメコン：東側経済協力</span><span class="chip">ワルシャワ条約機構：東側軍事同盟</span></div>1949年のNATOとコメコン、1955年のワルシャワ条約機構を、軍事／経済で分けて覚えると混乱しにくい。`,q:'コメコンは軍事同盟？',a:'違う。経済協力の枠組み。軍事同盟はワルシャワ条約機構。'},
{sec:'② 米ソ冷戦の始まりと西欧諸国',title:'西側の国々も、同じ道を歩んだわけではない。',take:'イギリスは福祉、フランスは自主外交、イタリアは共和政へ。',body:`西側諸国は同じ陣営でも国内政策はさまざま。イギリスでは重要産業の国有化や社会保障が進み、フランスではド＝ゴールが独自外交を展開。イタリアは1946年に共和政へ移行した。`,q:'フランスは1966年にNATOそのものを脱退した？',a:'違う。離れたのはNATOの統合軍事機構で、同盟自体からの脱退ではない。'},
{sec:'③ アジアの解放と自立',title:'中国の内戦と朝鮮の戦争が、冷戦につながる。',take:'アジアの国内対立に、米ソの対立が重なった。',body:`国共内戦の結果、1949年に中華人民共和国が成立し、国民政府は台湾へ移った。朝鮮半島では北に朝鮮民主主義人民共和国、南に大韓民国が成立し、1950年に朝鮮戦争が始まる。`,q:'中国では1949年に何が起きた？',a:'中華人民共和国が成立し、蔣介石の国民政府は台湾へ移った。'},
{sec:'③ アジアの解放と自立',title:'日本の独立回復と、東南アジアの脱植民地化。',take:'独立はゴールではなく、その後の安全保障の出発点でもある。',body:`朝鮮戦争を背景に日本では警察予備隊が設置され、1951年にサンフランシスコ平和条約と日米安全保障条約が結ばれた。東南アジアではインドネシア独立、ベトナムではフランスとのインドシナ戦争が進む。1954年のジュネーヴ休戦協定でベトナムは北緯17度線を境に暫定分断された。`,q:'朝鮮とベトナムの分断線は？',a:'朝鮮は38度線、ベトナムは北緯17度線。'},
{sec:'③ アジアの解放と自立',title:'南・西アジアでは、「自立」の形が分かれた。',take:'分離独立、資源国有化、建国と戦争。自立の課題は地域ごとに違う。',body:`インドとパキスタンは宗教対立を背景に分離独立。イランではモサッデグが石油国有化を進めた。パレスチナでは国連分割案をめぐる対立からイスラエル建国と戦争へつながった。`,q:'イランの石油国有化の狙いは？',a:'自国の資源とその利益に対する主導権を取り戻すこと。'},
{sec:'④ ソ連の「雪どけ」',title:'緊張は緩んだ。でも、東側の自由化は限定的だった。',take:'西側との平和共存と、東欧への支配維持は同時に進んだ。',body:`フルシチョフはスターリン批判と平和共存を打ち出し、「雪どけ」が進んだ。一方、東欧の自由化には限界があり、1956年のハンガリー動乱ではソ連が軍事介入した。`,q:'「雪どけ」なのに、なぜハンガリーへ介入したの？',a:'西側との全面衝突は避けても、東欧をソ連の勢力圏から離脱させるつもりはなかったから。'},
{sec:'⑤ アメリカ合衆国と欧州統合の動き',title:'冷戦は、アメリカの国内政治にも入り込んだ。',take:'国外では封じ込め、国内では共産主義への警戒が強まった。',body:`冷戦下のアメリカでは共産主義への不安が国内にも広がり、マッカーシーらによる「赤狩り」が進んだ。CIAなど安全保障機構も強化された。`,q:'「赤狩り」とは？',a:'共産主義者やその同調者と疑われた人々への追及や排除が広がったこと。'},
{sec:'⑤ アメリカ合衆国と欧州統合の動き',title:'欧州統合は、「戦争に使う産業」の共同管理から。',take:'いきなり一国になるのではなく、石炭・鉄鋼の共同管理から始めた。',body:`フランスと西ドイツを中心に、石炭と鉄鋼を共同管理するECSCが成立。そこからEEC、ECへと統合が広がっていく。戦争をしない約束だけでなく、戦争をしにくい仕組みをつくる発想だった。`,q:'NATOとECSCの違いは？',a:'NATOは軍事同盟。ECSCは石炭・鉄鋼の共同管理を通じた欧州統合の仕組み。'},
{sec:'総まとめ',title:'「秩序をつくる」と「陣営に分かれる」。',take:'戦後史は、国際協力と冷戦対立の二本線で見ると整理しやすい。',body:`第二次世界大戦後、国連や国際経済制度による新秩序がつくられた一方、米ソ対立で世界は二陣営へ分かれた。アジアでは独立運動と冷戦が重なり、分断と戦争が進む。さらに「雪どけ」や欧州統合のように、対立を緩和し新しい協力を生む動きも現れた。<br><a class="done" href="index.html">✓ DAY一覧へ戻る</a>`,q:'DAY27を一文でまとめると？',a:'戦後秩序をつくる国際協力と、米ソ冷戦による世界の分断が同時に進んだ時代。'}
];
let i=Number(localStorage.getItem('whsm-day27-card')||0);if(i<0||i>=cards.length)i=0;
function render(){const c=cards[i];document.getElementById('counter').textContent=`DAY27  ${i+1} / ${cards.length}`;document.getElementById('bar').style.width=`${(i+1)/cards.length*100}%`;document.getElementById('card').innerHTML=`<div class="eyebrow">${c.sec}</div><h1>${c.title}</h1><div class="take">${c.take}</div><div>${c.body}</div><div class="quiz"><button id="q">Q. ${c.q}</button><div class="answer" id="ans">${c.a}</div></div>`;document.getElementById('q').onclick=()=>{const a=document.getElementById('ans');a.style.display=a.style.display==='block'?'none':'block'};document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===cards.length-1?'DAY一覧へ →':'次へ進む →';localStorage.setItem('whsm-day27-card',i);localStorage.setItem('whsm-last','day27.html');window.scrollTo({top:0,behavior:'instant'})}
document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>{if(i<cards.length-1){i++;render()}else{localStorage.setItem('whsm-completed-days','1');location.href='index.html'}};render();
</script></body></html>
